# Local development environment (optional). Usage: docker compose run --rm php composer test
services:
  php:
    build: docker
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      DB_PGSQL_HOST: pgsql
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      - pgsql
  pgsql:
    image: postgres:17
    environment:
      POSTGRES_DB: ua_banks
      POSTGRES_USER: ua_banks
      POSTGRES_PASSWORD: secret
volumes:
  composer-cache:
